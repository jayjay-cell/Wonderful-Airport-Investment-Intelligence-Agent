# Aero Intel methodology configuration
#
# These are the same normalization reference values hardcoded in
# core/scoring.py's _DELAY_RATE_REFERENCE / _TAXI_OUT_REFERENCE_MINUTES /
# _CANCELLATION_RATE_REFERENCE / _LOAD_FACTOR_REFERENCE / _GROWTH_REFERENCE
# constants, documented here as the single visible source of what each
# threshold means and why. This file is not loaded at runtime -- it is
# reference documentation for the constants in core/scoring.py, kept next
# to them so a future calibration pass has one place to look.
#
# None of these values are empirically validated against real traffic data.
# They are MVP defaults chosen to produce reasonable score variation across
# large/medium/small-hub airports, not backtested industry standards.

metric_definitions:
  long_haul_threshold_miles:
    value: 1500
    description: >
      Minimum great-circle distance (statute miles) for a route to count as
      "long-haul". Purely definitional -- does not by itself indicate
      demand or pressure. User-overridable per query.

  long_haul_basis_default:
    value: departures
    allowed_values: [departures, passengers]
    description: >
      Default weighting basis for long-haul share: share of PERFORMED
      passenger departures (default) -- i.e. flights that actually
      operated, per BTS T-100's DEPARTURES_PERFORMED field, not
      DEPARTURES_SCHEDULED -- vs. share of passengers carried on those
      performed departures. Cargo-only operations are always excluded (see
      data/clients/bts_t100.py:filter_passenger_routes) -- at a major
      cargo hub like ANC, including cargo routes roughly triples the
      calculated long-haul share.

  trend_period_years:
    value: 3
    description: >
      Trailing complete years used for growth/CAGR calculations.

# ---------------------------------------------------------------------------
# Congestion Score normalization references (core/scoring.py:congestion_score)
# ---------------------------------------------------------------------------
# Each reference is the value at which a signal is treated as "fully bad"
# (normalized to 1.0). A missing signal is excluded from the average, never
# treated as 0 -- see core/models.py's Score.missing.
congestion_score_references:
  departure_delay_rate: 0.25
  median_taxi_out_minutes: 20.0
  cancellation_rate: 0.03

# ---------------------------------------------------------------------------
# Opportunity Score weights and references (core/scoring.py:opportunity_score)
# ---------------------------------------------------------------------------
# Per-investment-focus weights, applied to a weighted blend of growth, load
# factor, congestion, and (terminal/gates only) long-haul share. A missing
# input drops out and the remaining weights are renormalized to sum to 1.0.
opportunity_score_references:
  passenger_yoy_growth: 0.05    # growth at/above this normalizes to "fully high demand"
  load_factor: 0.85             # load factor at/above this normalizes to "fully high pressure"

opportunity_score_weights:
  terminal:               {growth: 0.30, load_factor: 0.30, congestion: 0.25, long_haul_share: 0.15}
  gates:                  {growth: 0.30, load_factor: 0.35, congestion: 0.20, long_haul_share: 0.15}
  runway_airfield:        {growth: 0.25, load_factor: 0.15, congestion: 0.60}
  operations_technology:  {growth: 0.25, load_factor: 0.20, congestion: 0.55}
  general_modernization:  {growth: 0.30, load_factor: 0.25, congestion: 0.45}

# ---------------------------------------------------------------------------
