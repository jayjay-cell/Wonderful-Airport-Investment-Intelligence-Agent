#             nonzero departures). At ANC 2024, cargo-only routes are ~55%
#             of total departures. long_haul_basis_default's "scheduled
#             passenger departures" definition requires filtering these out
#             before computing long-haul share — see
#             data/clients/bts_t100.py:filter_passenger_routes. Without this
#             filter the calculated share is materially wrong (45% vs the
#             correct ~14% for ANC 2024).
